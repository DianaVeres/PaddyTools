{% extends 'base.html' %}{% block content %}
<section class="hero"><div><h1>Nueva incidencia</h1><p>{% if prefill.source_ref %}Datos recibidos desde Gestión Unificada: <b>{{prefill.source_ref}}</b>{% else %}Alta manual de incidencia.{% endif %}</p></div></section>
<form class="form" method="post" action="/incidencias/nueva">
<input type="hidden" name="source_type" value="{{prefill.source_type or 'manual'}}"><input type="hidden" name="source_ref" value="{{prefill.source_ref or ''}}">
<div class="grid"><label>Referencia<input name="order_number" required value="{{prefill.order_number or prefill.source_ref or ''}}"></label><label>ID interno<input name="order_id" value="{{prefill.order_id or ''}}"></label><label>Cliente<input name="customer_name" value="{{prefill.customer_name or ''}}"></label><label>Email<input name="customer_email" value="{{prefill.customer_email or ''}}"></label><label>Teléfono<input name="customer_phone" value="{{prefill.customer_phone or ''}}"></label><label>Fecha pedido<input name="order_date" value="{{prefill.order_date or ''}}"></label><label>Estado pedido<input name="order_status" value="{{prefill.order_status or ''}}"></label><label>Total<input name="order_total" value="{{prefill.order_total or ''}}"></label><label>Colegio / recogida<input name="pickup_school_name" value="{{prefill.pickup_school_name or ''}}"></label><label>Colegio incidencia<input name="incident_school_name" value="{{prefill.incident_school_name or ''}}"></label></div>
<label>Dirección de envío<textarea name="shipping_address">{{prefill.shipping_address or ''}}</textarea></label><label>Dirección de facturación<textarea name="billing_address">{{prefill.billing_address or ''}}</textarea></label>
<input type="hidden" name="products_json" value='{{(prefill.products_json or "[]")|e}}'>
<label>Incidencia<textarea name="incident_text" required rows="6">{{prefill.incident_text or ''}}</textarea></label>
<div class="grid"><label>Fecha incidencia<input name="incident_date" type="date" value="{{prefill.incident_date or ''}}"></label><label class="check"><input type="checkbox" name="pickup_school" value="1" {% if prefill.pickup_school %}checked{% endif %}> Recogida en colegio</label></div>
<label>Detalles de recogida<textarea name="pickup_details">{{prefill.pickup_details or ''}}</textarea></label><button class="btn primary" type="submit">Guardar incidencia</button></form>
{% endblock %}
